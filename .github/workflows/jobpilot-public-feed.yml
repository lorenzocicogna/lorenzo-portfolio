name: Job Pilot - public job feed

on:
  workflow_dispatch:
  schedule:
    # Runs each day after the private Job Pilot scan (07:17 UTC).
    # GitHub may delay scheduled workflows.
    - cron: "43 7 * * *"

permissions:
  contents: write

concurrency:
  group: jobpilot-public-feed
  cancel-in-progress: false

jobs:
  publish-job-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Use Python (standard library only)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate public-only feed logic offline
        run: python -m unittest discover -s jobpilot-feed/tests -v

      - name: Collect public Greenhouse and Lever offers
        run: |
          python jobpilot-feed/src/scout.py \
            --boards jobpilot-feed/src/boards.json \
            --output jobpilot-feed/latest-jobs.json

      - name: Prepare published graduate and institution watchlist
        run: |
          python jobpilot-feed/src/watchlist.py \
            --input jobpilot-feed/src/programmes-watchlist.source.json \
            --output jobpilot-feed/programmes-watchlist.json

      - name: Safely publish only the two public JSON files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- jobpilot-feed/latest-jobs.json jobpilot-feed/programmes-watchlist.json
          if git diff --cached --quiet; then
            echo "Public feed already up-to-date."
            exit 0
          fi
          git commit -m "data: update public Job Pilot job listings [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::Public feed update conflicted with concurrent edits."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Public feed published (attempt $attempt)"
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "::error::Feed publishing failed after 5 attempts. No force-push performed."
          exit 1
