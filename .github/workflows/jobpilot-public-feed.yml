name: Job Pilot - public job feed

on:
  workflow_dispatch:
  schedule:
    # Runs each day after the private Job Pilot scan (07:17 UTC).
    # GitHub may delay scheduled workflows.
    - cron: "43 7 * * *"

permissions:
  contents: write
  pull-requests: write
  pages: write

concurrency:
  group: jobpilot-public-feed
  cancel-in-progress: false

jobs:
  publish-job-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Use Python (standard library only)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate public-only feed logic offline
        run: python -m unittest discover -s jobpilot-feed/tests -v

      - name: Collect public Greenhouse and Lever offers
        run: |
          python jobpilot-feed/src/scout.py \
            --boards jobpilot-feed/src/boards.json \
            --output jobpilot-feed/latest-jobs.json

      - name: Prepare published graduate and institution watchlist
        run: |
          python jobpilot-feed/src/watchlist.py \
            --input jobpilot-feed/src/programmes-watchlist.source.json \
            --output jobpilot-feed/programmes-watchlist.json

      - name: Create PR, merge it and request Pages rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only these two public job listing files may be published.
          git add -- jobpilot-feed/latest-jobs.json jobpilot-feed/programmes-watchlist.json
          if git diff --cached --quiet; then
            echo "Public feed already up-to-date."
            exit 0
          fi

          # Never push to protected main; every update goes through a PR.
          branch="automation/jobpilot-feed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "data: refresh public Job Pilot job leads"
          git push origin "HEAD:refs/heads/$branch"

          if ! pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "data: refresh public Job Pilot feed" \
              --body "Automated update of public ATS listings and official programme watchlist only. The scanner and offline checks passed. No personal job applications or private notes are included.")"; then
            echo "::error::Enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General > Workflow permissions, then re-run this workflow." >&2
            echo "::error::The update branch '$branch' remains available for a manual pull request." >&2
            exit 1
          fi

          echo "Created $pr_url"
          # Main requires a PR but no approving reviews. No bypass.
          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

          # GITHUB_TOKEN-created commits do not trigger branch-based Pages builds.
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null; then
            echo "::error::Merged $pr_url, but Pages rebuild request failed; verify published feed and Pages permissions." >&2
            exit 1
          fi
          echo "Merged $pr_url and queued a GitHub Pages rebuild."
